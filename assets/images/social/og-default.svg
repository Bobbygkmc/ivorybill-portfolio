<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Uyammadu Dev Services social preview</title>
  <desc id="desc">Social preview card for Uyammadu Dev Services with an abstract systems console.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset=".58" stop-color="#0a1f3d"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#174164" opacity=".38"/>
