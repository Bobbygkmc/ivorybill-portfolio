<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Operator console visual</title>
  <desc id="desc">Abstract technical operator console with status panels, terminal lines, and systems grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071527"/>
      <stop offset="0.55" stop-color="#0a1f3d"/>
      <stop offset="1" stop-color="#04101f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102d52"/>
      <stop offset="1" stop-color="#071b33"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1b4570" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="800" rx="36" fill="url(#grid)" opacity=".55"/>
  <circle cx="985" cy="135" r="190" fill="#00b4d8" opacity=".12"/>
  <circle cx="160" cy="710" r="220" fill="#0062b9" opacity=".20"/>
  <rect x="86" y="82" width="1028" height="636" rx="30" fill="#07182c" stroke="#25547d" stroke-width="2"/>
  <rect x="118" y="116" width="960" height="64" rx="18" fill="#0d2848" stroke="#2a5c87"/>
  <circle cx="154" cy="148" r="9" fill="#ef4444"/>
  <circle cx="184" cy="148" r="9" fill="#f59e0b"/>
  <circle cx="214" cy="148" r="9" fill="#10b981"/>
  <text x="255" y="155" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="22">operator-console / systems-intake</text>
  <g transform="translate(118 216)">
    <rect width="438" height="282" rx="22" fill="url(#panel)" stroke="#2b638e"/>
    <text x="28" y="48" fill="#00b4d8" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="28">Systems Queue</text>
    <g font-family="JetBrains Mono, monospace" font-size="20">
      <text x="30" y="94" fill="#c7e4ff">01  assess owner need</text>
      <text x="30" y="134" fill="#c7e4ff">02  map current tools</text>
      <text x="30" y="174" fill="#c7e4ff">03  document clean handoff</text>
      <text x="30" y="214" fill="#7dd3fc">status: practical path found</text>
    </g>
    <rect x="30" y="242" width="330" height="10" rx="5" fill="#123a62"/>
    <rect x="30" y="242" width="236" height="10" rx="5" fill="#00b4d8" filter="url(#glow)"/>
  </g>
  <g transform="translate(606 216)">
    <rect width="472" height="282" rx="22" fill="url(#panel)" stroke="#2b638e"/>
    <text x="28" y="48" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="28">Operator Proof Wall</text>
    <g fill="none" stroke-width="3">
      <path d="M52 212V96h60v116" stroke="#00b4d8"/>
      <path d="M148 212V130h60v82" stroke="#60a5fa"/>
      <path d="M244 212V74h60v138" stroke="#10b981"/>
      <path d="M340 212v-52h60v52" stroke="#f59e0b"/>
    </g>
    <g fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="16">
      <text x="54" y="238">cloud</text>
      <text x="150" y="238">web</text>
      <text x="246" y="238">ai</text>
      <text x="342" y="238">local</text>
    </g>
  </g>
  <g transform="translate(118 540)">
    <rect width="960" height="132" rx="22" fill="#091f38" stroke="#245178"/>
    <path d="M46 68h160m40 0h88m40 0h198m40 0h104m40 0h128" stroke="#00b4d8" stroke-width="8" stroke-linecap="round" opacity=".95"/>
    <path d="M46 96h88m40 0h220m40 0h138m40 0h252" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" opacity=".55"/>
    <text x="46" y="38" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="18">clean scope -> secure build -> owner handoff</text>
  </g>
</svg>
