<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Camera NVR systems lab</title>
  <desc id="desc">Abstract camera and local recorder system diagram with privacy-first visual language.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0a1f3d"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0v42" fill="none" stroke="#174164" opacity=".38"/></pattern>
  </defs>
  <rect width="900" height="600" rx="28" fill="url(#bg)"/>
  <rect width="900" height="600" rx="28" fill="url(#grid)"/>
  <text x="58" y="82" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Camera/NVR</text>
  <text x="58" y="114" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="17">local recording / owner access</text>
  <g transform="translate(92 186)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="240" height="152" rx="20" fill="#0b2542" stroke="#2b638e" stroke-width="3"/>
    <path d="M58 82h124M120 28v108" stroke="#00b4d8" stroke-width="8"/>
    <circle cx="120" cy="82" r="38" stroke="#60a5fa" stroke-width="8"/>
    <path d="M240 76h118" stroke="#2b638e" stroke-width="5"/>
    <path d="M358 76h126" stroke="#00b4d8" stroke-width="5"/>
    <rect x="484" y="-12" width="226" height="176" rx="20" fill="#0b2542" stroke="#2b638e" stroke-width="3"/>
    <path d="M528 44h136M528 84h92M528 124h142" stroke="#c7e4ff" stroke-width="10"/>
    <circle cx="670" cy="44" r="8" fill="#10b981" stroke="none"/>
  </g>
  <g transform="translate(118 410)" font-family="JetBrains Mono, monospace" font-size="18">
    <rect width="664" height="76" rx="18" fill="#091f38" stroke="#245178"/>
    <text x="28" y="32" fill="#c7e4ff">privacy mode: no public footage</text>
    <text x="28" y="58" fill="#94a3b8">retention, remote access, and handoff documented</text>
  </g>
</svg>
