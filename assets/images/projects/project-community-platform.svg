<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Community platform visual</title>
  <desc id="desc">Abstract local builder community platform with event and member tiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0a1f3d"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0v44" fill="none" stroke="#174164" opacity=".35"/></pattern>
  </defs>
  <rect width="900" height="600" rx="28" fill="url(#bg)"/>
  <rect width="900" height="600" rx="28" fill="url(#grid)"/>
  <text x="58" y="82" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Community Platform</text>
  <text x="58" y="114" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="17">events / builds / member profiles</text>
  <g transform="translate(102 174)">
    <rect width="696" height="300" rx="24" fill="#0b2542" stroke="#2b638e" stroke-width="3"/>
    <g fill="#091f38" stroke="#245178" stroke-width="2">
      <rect x="34" y="38" width="190" height="94" rx="16"/><rect x="252" y="38" width="190" height="94" rx="16"/><rect x="470" y="38" width="190" height="94" rx="16"/>
      <rect x="34" y="164" width="298" height="92" rx="16"/><rect x="364" y="164" width="296" height="92" rx="16"/>
    </g>
    <g fill="none" stroke="#00b4d8" stroke-width="6" stroke-linecap="round"><path d="M82 86h94M300 86h94M518 86h94M82 210h190M412 210h190"/></g>
    <g fill="#10b981"><circle cx="82" cy="58" r="9"/><circle cx="300" cy="58" r="9"/><circle cx="518" cy="58" r="9"/></g>
  </g>
</svg>
