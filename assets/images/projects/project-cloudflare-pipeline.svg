<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Cloud pipeline visual</title>
  <desc id="desc">Abstract static site deployment pipeline with build and clean route checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0a1f3d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#174164" opacity=".34"/></pattern>
  </defs>
  <rect width="900" height="600" rx="28" fill="url(#bg)"/>
  <rect width="900" height="600" rx="28" fill="url(#grid)"/>
  <text x="58" y="82" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Cloud Pipeline</text>
  <text x="58" y="114" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="17">build -> static deploy -> clean routes</text>
  <g transform="translate(80 196)">
    <g fill="#0b2542" stroke="#2b638e" stroke-width="3">
      <rect width="164" height="116" rx="20"/><rect x="286" width="164" height="116" rx="20"/><rect x="572" width="164" height="116" rx="20"/>
    </g>
    <g fill="#00b4d8"><path d="M186 48h78v20h-78z"/><path d="M472 48h78v20h-78z"/><path d="M254 32l30 26-30 26z"/><path d="M540 32l30 26-30 26z"/></g>
    <g font-family="Inter, Arial, sans-serif" font-weight="700" font-size="22" fill="#ffffff">
      <text x="42" y="66">SASS</text><text x="322" y="66">Build</text><text x="608" y="66">Pages</text>
    </g>
  </g>
  <g transform="translate(130 398)" font-family="JetBrains Mono, monospace" font-size="18">
    <rect width="640" height="78" rx="18" fill="#091f38" stroke="#245178"/>
    <text x="28" y="34" fill="#c7e4ff">/projects 200  /orion 200  /contact 200</text>
    <text x="28" y="60" fill="#10b981">contact backend preserved</text>
  </g>
</svg>
