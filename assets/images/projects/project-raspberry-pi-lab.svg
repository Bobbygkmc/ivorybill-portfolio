<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi server lab visual</title>
  <desc id="desc">Abstract small server lab with board, ports, and dashboard signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0a1f3d"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#174164" opacity=".36"/></pattern>
  </defs>
  <rect width="900" height="600" rx="28" fill="url(#bg)"/>
  <rect width="900" height="600" rx="28" fill="url(#grid)"/>
  <text x="58" y="82" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Server Lab</text>
  <text x="58" y="114" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="17">local services / edge compute</text>
