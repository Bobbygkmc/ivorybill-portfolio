    <path d="M142 240h96M260 240h60M142 266h178" stroke="#60a5fa" stroke-width="10" stroke-linecap="round"/>
    <path d="M378 180h156" stroke="#00b4d8" stroke-width="6"/>
    <rect x="534" y="74" width="210" height="222" rx="22" fill="#0b2542" stroke="#2b638e" stroke-width="4"/>
    <path d="M574 132h122M574 176h84M574 220h138" stroke="#c7e4ff" stroke-width="10" stroke-linecap="round"/>
