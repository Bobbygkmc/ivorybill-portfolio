<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">AI workflow dashboard</title>
  <desc id="desc">Abstract AI dashboard with charts and safe fictional data blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0a1f3d"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#174164" opacity=".4"/></pattern>
  </defs>
  <rect width="900" height="600" rx="28" fill="url(#bg)"/>
  <rect width="900" height="600" rx="28" fill="url(#grid)"/>
  <circle cx="760" cy="82" r="130" fill="#00b4d8" opacity=".13"/>
  <text x="58" y="80" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">AI Workflow</text>
  <text x="58" y="112" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="17">synthetic demo data only</text>
  <rect x="58" y="150" width="304" height="330" rx="22" fill="#0b2542" stroke="#2b638e"/>
  <rect x="400" y="150" width="442" height="150" rx="22" fill="#0b2542" stroke="#2b638e"/>
  <rect x="400" y="330" width="442" height="150" rx="22" fill="#0b2542" stroke="#2b638e"/>
  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M104 410c46-152 112-186 212-230" stroke="#00b4d8"/>
    <path d="M104 406c52-88 116-108 212-112" stroke="#60a5fa" opacity=".72"/>
  </g>
  <g fill="#10b981">
    <circle cx="104" cy="410" r="8"/><circle cx="176" cy="310" r="8"/><circle cx="244" cy="244" r="8"/><circle cx="316" cy="180" r="8"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="18" fill="#c7e4ff">
    <text x="430" y="196">guardrail_check: pass</text>
    <text x="430" y="234">query_mode: read_only</text>
    <text x="430" y="272">handoff: analyst_summary</text>
    <text x="430" y="376">insight queue</text>
    <text x="430" y="420">trend / anomaly / next step</text>
  </g>
  <g fill="#00b4d8"><rect x="664" y="184" width="120" height="12" rx="6"/><rect x="664" y="222" width="82" height="12" rx="6"/><rect x="664" y="260" width="142" height="12" rx="6"/></g>
</svg>
